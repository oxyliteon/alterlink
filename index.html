<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batas Pengunjung Tercapai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belleza&display=swap" rel="stylesheet">
    <style>body { font-family: 'Belleza', sans-serif; }</style>
</head>
<body class="bg-[#F2F2F7] text-slate-800 min-h-screen flex items-center justify-center p-6 antialiased">
    
    <div class="max-w-md w-full bg-white/70 backdrop-blur-2xl p-8 rounded-[2rem] border border-white shadow-[0_8px_32px_rgba(0,0,0,0.04)] text-center relative overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-blue-400/20 rounded-full blur-3xl -z-10"></div>
        
        <div class="w-16 h-16 mx-auto mb-6 bg-white/80 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-center">
            <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        
        <h1 class="text-2xl font-semibold text-slate-900 mb-2 tracking-tight">Kuota Hari Ini Penuh</h1>
        <p class="text-slate-500 mb-8 leading-relaxed text-sm">Maksimal batas pengunjung untuk sesi ini telah tercapai. Akses akan dibuka kembali secara otomatis dalam:</p>

        <div class="flex justify-center gap-3 mb-10">
            <div class="bg-white/60 border border-slate-200/60 rounded-2xl p-3 w-20 shadow-sm backdrop-blur-md">
                <div id="hours" class="text-2xl text-slate-800 tracking-tight">00</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1 font-sans">Jam</div>
            </div>
            <div class="text-2xl text-slate-400 mt-2">:</div>
            <div class="bg-white/60 border border-slate-200/60 rounded-2xl p-3 w-20 shadow-sm backdrop-blur-md">
                <div id="minutes" class="text-2xl text-slate-800 tracking-tight">00</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1 font-sans">Mnt</div>
            </div>
            <div class="text-2xl text-slate-400 mt-2">:</div>
            <div class="bg-white/60 border border-slate-200/60 rounded-2xl p-3 w-20 shadow-sm backdrop-blur-md">
                <div id="seconds" class="text-2xl text-blue-500 tracking-tight">00</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1 font-sans">Dtk</div>
            </div>
        </div>
        
        <div class="text-left bg-white/50 border border-slate-200/50 rounded-2xl overflow-hidden shadow-sm backdrop-blur-md">
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest px-4 pt-4 pb-2 font-sans">Jelajahi Alternatif</p>
            <div id="links-container"><p class="px-4 py-4 text-sm text-slate-400 text-center animate-pulse">Memuat link...</p></div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://bnllplehnadtksnuzbtq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJubGxwbGVobmFkdGtzbnV6YnRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNDc5NzgsImV4cCI6MjEwMDYyMzk3OH0.3U5B08_hEWEMZZGblRljL5hesk2pLsdNoCiqBu-hpPk';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchLinks() {
            const container = document.getElementById('links-container');
            try {
                const { data, error } = await supabase.from('alternative_links').select('*').order('urutan', { ascending: true });

                if (error) {
                    container.innerHTML = `<p class="px-4 py-4 text-sm text-red-500 text-center font-sans">Error DB: ${error.message}</p>`;
                    return;
                }
                
                if (!data || data.length === 0) {
                    container.innerHTML = `<p class="px-4 py-4 text-sm text-slate-500 text-center font-sans">Belum ada link yang ditambahkan.</p>`;
                    return;
                }

                container.innerHTML = '';
                data.forEach((item, index) => {
                    const borderClass = index === data.length - 1 ? '' : 'border-b border-slate-200/50';
                    container.innerHTML += `
                        <a href="${item.url}" target="_blank" class="flex items-center justify-between px-4 py-3 bg-transparent hover:bg-white/60 active:bg-slate-100 transition-colors ${borderClass}">
                            <span class="text-base text-slate-700">${item.judul}</span>
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </a>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<p class="px-4 py-4 text-sm text-red-500 text-center font-sans">Koneksi Gagal.</p>`;
            }
        }

        fetchLinks();

        function updateCountdown() {
            const now = new Date();
            const midnight = new Date(now);
            midnight.setHours(24, 0, 0, 0); 
            const diff = midnight - now;
            if (diff <= 0) { window.location.reload(); return; }
            
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);

            document.getElementById('hours').innerText = String(h).padStart(2, '0');
            document.getElementById('minutes').innerText = String(m).padStart(2, '0');
            document.getElementById('seconds').innerText = String(s).padStart(2, '0');
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
