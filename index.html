<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Deteksi Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">
    
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg mt-10">
        <h1 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">Status Live GitHub Pages</h1>
        
        <!-- Layar Monitor Deteksi -->
        <div id="monitor" class="bg-slate-900 text-green-400 font-mono text-sm p-4 rounded-lg min-h-[150px] space-y-2 mb-6 break-words">
            <p class="text-white">Memulai sistem deteksi...</p>
        </div>

        <div id="hasil-akhir" class="space-y-2"></div>
    </div>

    <script>
        const monitor = document.getElementById('monitor');
        const hasil = document.getElementById('hasil-akhir');

        function logStatus(pesan, warna = 'text-green-400') {
            monitor.innerHTML += `<p class="${warna}">> ${pesan}</p>`;
        }

        async function jalankanTes() {
            logStatus("✅ Kode HTML versi TERBARU berhasil dimuat oleh browser.");
            
            try {
                logStatus("⚙️ Menyiapkan kredensial Supabase...", "text-yellow-400");
                const url = 'https://bnllplehnadtksnuzbtq.supabase.co';
                const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJubGxwbGVobmFkdGtzbnV6YnRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNDc5NzgsImV4cCI6MjEwMDYyMzk3OH0.3U5B08_hEWEMZZGblRljL5hesk2pLsdNoCiqBu-hpPk';
                const sb = window.supabase.createClient(url, key);
                
                logStatus("🚀 Mengirim request ke database (alternative_links)...", "text-blue-400");
                
                const { data, error } = await sb.from('alternative_links').select('*').order('urutan');
                
                if (error) {
                    logStatus(`❌ ERROR DARI DATABASE: ${error.message}`, "text-red-500 font-bold");
                    return;
                }
                
                logStatus(`✅ Data diterima! Ditemukan ${data.length} link.`, "text-green-400 font-bold");

                // Tampilkan hasilnya ke layar jika berhasil
                data.forEach(item => {
                    hasil.innerHTML += `
                        <a href="${item.url}" class="block p-3 bg-blue-50 border border-blue-200 rounded-lg text-blue-700 font-semibold mb-2">
                            ${item.judul}
                        </a>
                    `;
                });

            } catch (err) {
                logStatus(`💥 CRASH FATAL: ${err.message}`, "text-red-500 bg-white p-1");
            }
        }

        setTimeout(jalankanTes, 1000);
    </script>
</body>
</html>
